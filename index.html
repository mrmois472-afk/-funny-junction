<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funny Junction</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#111;color:#fff;text-align:center}
    .wrap{max-width:800px;margin:auto;padding:40px 20px}
    h1{font-size:42px;margin-bottom:10px}
    p{color:#ccc}
    .btn{display:inline-block;margin:12px;padding:14px 24px;border-radius:10px;
         background:#ff0000;color:#fff;text-decoration:none;font-weight:bold}
    .movie{margin-top:35px;padding:25px;border:1px solid #333;border-radius:16px}
  </style>
</head>
<body>
  <script>
document.addEventListener("DOMContentLoaded", function () {
  const movie = document.querySelector(".movie");
  const subscribeBtn = document.querySelector(".btn");

  if (!localStorage.getItem("fjUnlocked")) {
    movie.style.display = "none";
  }

  subscribeBtn.addEventListener("click", function () {
    localStorage.setItem("fjUnlocked", "1");
    setTimeout(function () {
      movie.style.display = "block";
    }, 1000);
  });

  const search = document.createElement("input");
  search.placeholder = "🔍 Video search karein...";
  search.style = "width:90%;padding:12px;margin:15px;border-radius:8px;border:1px solid #555;";

  document.querySelector(".wrap").insertBefore(search, movie);

  search.addEventListener("input", function () {
    movie.style.display =
      movie.innerText.toLowerCase().includes(search.value.toLowerCase())
        ? "block" : "none";
  });

  const iframe = document.querySelector("iframe");
  const fullscreen = document.createElement("button");
  fullscreen.innerText = "⛶ Full Screen";
  fullscreen.style = "padding:12px 20px;margin:10px;border-radius:8px;";

  iframe.parentNode.insertBefore(fullscreen, iframe);

  fullscreen.onclick = function () {
    if (iframe.requestFullscreen) iframe.requestFullscreen();
  };
});
  </script>
  <div class="wrap">
    <h1>Funny Junction 🎬</h1>
    <p>Funny videos aur entertainment ke liye hamara channel subscribe karein.</p>

    <a class="btn" href="https://youtube.com/@funnyjunction_yt" target="_blank" rel="noopener">
      YouTube Channel Subscribe Karein
    </a>

    <div class="movie">
      <h2>🎬 Dhundhte Reh Jaaoge</h2>
      <iframe src="https://drive.google.com/file/d/1q-bKy5KWJT58-ZvmX5nhjsbQ2XCORshM/preview" width="100%" height="500" allow="autoplay" allowfullscreen></iframe>
      <p>Yahan apni khud ki ya licensed video/movie add karein.</p>
      <p>Video player yahan add kiya ja sakta hai.</p>
    </div>
  </div>
</body>
</html>
